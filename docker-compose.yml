version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kromicstore-db
    environment:
      POSTGRES_DB: kromicstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/KromicStore.API/Dockerfile
    container_name: kromicstore-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=kromicstore;Username=postgres;Password=${DB_PASSWORD:-postgres}"
      Jwt__Secret: ${JWT_SECRET:-your-secret-key-min-32-characters-long-1234567890}
      Jwt__Issuer: ${JWT_ISSUER:-KromicStore}
      Jwt__Audience: ${JWT_AUDIENCE:-KromicStore}
      MultiTenancy__BaseDomain: ${BASE_DOMAIN:-localhost:5000}
      Brevo__Enabled: "false"
      Cloudinary__Enabled: "false"
      Razorpay__Enabled: "false"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:
